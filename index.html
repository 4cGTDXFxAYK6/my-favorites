<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お気に入り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 24px;
      font-size: 28px;
    }

    .search-box {
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .tile {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 120px;
      padding: 15px;

      background: white;
      border-radius: 16px;

      text-decoration: none;
      color: #333;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

      transition: transform 0.1s ease;
    }

    .tile:active {
      transform: scale(0.96);
    }

    .icon {
      width: 40px;
      height: 40px;
      margin-bottom: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    .icon img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      padding: 20px;
      background: white;
      border-radius: 12px;
      color: #c00;
      text-align: center;
    }

    @media (min-width: 700px) {
      .tiles {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⭐ お気に入り</h1>

    <div class="search-box">
      <input
        type="search"
        id="search"
        placeholder="🔍 お気に入りを検索"
      >
    </div>

    <div id="favorites">
      <div class="loading">
        読み込み中...
      </div>
    </div>

  </div>

  <script>

    let favorites = [];

    /*
     * --------------------------------
     * お気に入りデータを保存
     * --------------------------------
     */
    function saveFavorites() {

      localStorage.setItem(
        "myFavorites",
        JSON.stringify(favorites)
      );

    }


    /*
     * --------------------------------
     * お気に入りデータを読み込む
     * --------------------------------
     */
    async function loadFavorites() {

      const saved =
        localStorage.getItem("myFavorites");

      /*
       * すでにブラウザに保存されている場合
       */
      if (saved) {

        try {

          favorites =
            JSON.parse(saved);

          displayFavorites();

          return;

        } catch (error) {

          console.error(
            "保存されたお気に入りデータを読み込めませんでした。",
            error
          );

        }

      }


      /*
       * 初回だけ favorites.json を読み込む
       */
      try {

        const response =
          await fetch(
            "favorites.json?v=" + Date.now()
          );

        if (!response.ok) {

          throw new Error(
            "favorites.jsonを読み込めませんでした"
          );

        }

        favorites =
          await response.json();

        saveFavorites();

        displayFavorites();

      } catch (error) {

        document.getElementById(
          "favorites"
        ).innerHTML = `
          <div class="error">
            お気に入りデータを読み込めませんでした。
          </div>
        `;

        console.error(error);

      }

    }


    /*
     * --------------------------------
     * お気に入りを表示
     * --------------------------------
     */
    function displayFavorites() {

      const keyword =
        document
          .getElementById("search")
          .value
          .toLowerCase()
          .trim();


      /*
       * 検索
       */
      const filtered =
        favorites
          .filter(item => {

            const name =
              (item.name || "")
                .toLowerCase();

            return name.includes(keyword);

          })
          .sort(
            (a, b) =>
              (a.order || 9999) -
              (b.order || 9999)
          );


      const container =
        document.getElementById(
          "favorites"
        );


      /*
       * 該当なし
       */
      if (filtered.length === 0) {

        container.innerHTML = `
          <div class="loading">
            該当するお気に入りがありません。
          </div>
        `;

        return;

      }


      /*
       * タイルを作成
       */
      container.innerHTML = "";

      const tiles =
        document.createElement("div");

      tiles.className = "tiles";


      filtered.forEach(item => {

        const link =
          document.createElement("a");

        link.className = "tile";

        link.href = item.url;

        link.target = "_blank";

        link.rel =
          "noopener noreferrer";


        /*
         * アイコン
         */
        const icon =
          document.createElement("div");

        icon.className = "icon";


        /*
         * ファビコンが指定されている場合
         */
        if (item.favicon) {

          const img =
            document.createElement("img");

          img.src = item.favicon;

          img.alt = "";

          img.onerror = function() {

            icon.innerHTML = "🌐";

          };

          icon.appendChild(img);

        } else {

          icon.textContent =
            item.icon || "🔗";

        }


        /*
         * サイト名
         */
        const name =
          document.createElement("div");

        name.className = "name";

        name.textContent =
          item.name;


        link.appendChild(icon);

        link.appendChild(name);

        tiles.appendChild(link);

      });


      container.appendChild(tiles);

    }


    /*
     * --------------------------------
     * 検索
     * --------------------------------
     */
    document
      .getElementById("search")
      .addEventListener(
        "input",
        displayFavorites
      );


    /*
     * --------------------------------
     * 起動
     * --------------------------------
     */
    loadFavorites();

  </script>

</body>
</html>
