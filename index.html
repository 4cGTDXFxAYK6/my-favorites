<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">

  <title>お気に入り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    /* ==================================
       ヘッダー
       ================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 14px 16px 10px;
    }

    .title {
      margin: 0;

      font-size: 22px;
      font-weight: 700;
    }

    .menu-button {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 12px;

      background: white;

      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* ==================================
       メイン
       ================================== */

    .container {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 6px 12px 30px;
    }

    /* ==================================
       タイル
       ================================== */

    .tiles {
      display: grid;

      /* スマホ：4列 */
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
    }

    .tile {
      position: relative;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      /*
       * 正方形にする
       */
      aspect-ratio: 1 / 1;

      min-width: 0;

      padding: 7px;

      background: white;

      border-radius: 13px;

      text-decoration: none;

      color: #333;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.1s ease;
    }

    .tile:active {
      transform: scale(0.95);
    }

    /* ==================================
       ファビコン
       ================================== */

    .icon {
      width: 34px;
      height: 34px;

      margin-bottom: 4px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      font-size: 25px;
    }

    .icon img {
      width: 32px;
      height: 32px;

      object-fit: contain;

      border-radius: 6px;
    }

    /* ==================================
       サイト名
       ================================== */

    .name {
      width: 100%;

      font-size: 12px;
      font-weight: 600;

      line-height: 1.25;

      text-align: center;

      word-break: break-word;

      overflow-wrap: anywhere;
    }

    /* ==================================
       読み込み・空表示
       ================================== */

    .loading {
      text-align: center;

      padding: 40px 20px;

      color: #777;
    }

    .empty {
      text-align: center;

      padding: 50px 20px;

      color: #777;
    }

    /* ==================================
       PC
       ================================== */

    @media (min-width: 700px) {

      .container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .tiles {
        /* PC：基本10列 */
        grid-template-columns: repeat(10, minmax(0, 1fr));
        gap: 12px;
      }

      .tile {
        padding: 10px;
      }

      .icon {
        width: 42px;
        height: 42px;

        margin-bottom: 6px;

        font-size: 30px;
      }

      .icon img {
        width: 38px;
        height: 38px;
      }

      .name {
        font-size: 14px;
      }

    }

    /* ==================================
       メニュー
       ================================== */

    .menu-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.25);

      display: none;

      z-index: 1000;
    }

    .menu-overlay.open {
      display: block;
    }

    .menu-panel {
      position: absolute;

      top: 0;
      right: 0;

      width:
        min(330px, 88vw);

      height: 100%;

      padding: 22px 18px;

      background: white;

      box-shadow:
        -4px 0 18px rgba(0, 0, 0, 0.15);

      overflow-y: auto;
    }

    .menu-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .menu-title {
      font-size: 20px;

      font-weight: 700;
    }

    .close-button {
      width: 40px;
      height: 40px;

      border: none;

      border-radius: 10px;

      background: #f2f2f2;

      font-size: 21px;

      cursor: pointer;
    }

    .menu-item {
      width: 100%;

      display: flex;

      align-items: center;

      padding: 14px 11px;

      border: none;

      border-radius: 10px;

      background: transparent;

      font-size: 16px;

      text-align: left;

      cursor: pointer;
    }

    .menu-item:active {
      background: #f0f0f0;
    }

    .menu-section {
      margin-top: 20px;

      padding-top: 16px;

      border-top:
        1px solid #eee;
    }

    .menu-section-title {
      margin:
        0 0 7px 11px;

      font-size: 13px;

      color: #777;
    }

    .sort-option {
      width: 100%;

      display: flex;

      align-items: center;

      padding: 11px;

      border: none;

      border-radius: 10px;

      background: transparent;

      font-size: 15px;

      cursor: pointer;

      text-align: left;
    }

    .sort-option:active {
      background: #f0f0f0;
    }

    .sort-option.active {
      font-weight: 700;

      background: #f2f2f2;
    }

    .sort-mark {
      width: 25px;

      margin-right: 5px;
    }

    /* ==================================
       ダイアログ
       ================================== */

    .dialog-overlay {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.35);

      z-index: 2000;
    }

    .dialog-overlay.open {
      display: flex;
    }

    .dialog {
      width:
        min(450px, 100%);

      padding: 23px;

      background: white;

      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .dialog h2 {
      margin:
        0 0 19px;

      font-size: 21px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 600;
    }

    .form-group input {
      width: 100%;

      padding: 12px 13px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;
    }

    .form-group input:focus {
      border-color: #888;
    }

    .dialog-buttons {
      display: flex;

      gap: 10px;

      margin-top: 21px;
    }

    .dialog-button {
      flex: 1;

      padding: 13px;

      border: none;

      border-radius: 10px;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    .cancel-button {
      background: #eee;
    }

    .register-button {
      background: #333;

      color: white;
    }

    /* ==================================
       編集モード
       ================================== */

    .delete-button {
      position: absolute;

      top: 5px;
      right: 5px;

      width: 29px;
      height: 29px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: none;

      border-radius: 50%;

      background: #eee;

      font-size: 16px;

      cursor: pointer;

      z-index: 5;
    }

    .delete-button:active {
      transform: scale(0.9);
    }

    .edit-header {
      display: none;

      align-items: center;
      justify-content: space-between;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 14px 16px 10px;
    }

    .edit-header.open {
      display: flex;
    }

    .edit-title {
      font-size: 20px;

      font-weight: 700;
    }

    .done-button {
      padding: 9px 14px;

      border: none;

      border-radius: 10px;

      background: #333;

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    .edit-search {
      display: none;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding:
        4px 16px 14px;
    }

    .edit-search.open {
      display: block;
    }

    .edit-search input {
      width: 100%;

      padding: 11px 14px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      background: white;

      font-size: 16px;

      outline: none;
    }

    .normal-header.hidden {
      display: none;
    }

    /* ==================================
       バックアップ
       ================================== */

    .backup-info {
      padding: 13px;

      background: #f7f7f7;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.6;
    }

    .backup-count {
      font-weight: 700;
    }

    .file-input {
      width: 100%;

      padding: 10px 0;

      font-size: 15px;
    }

    .restore-warning {
      margin-top: 12px;

      padding: 12px;

      background: #fff8e1;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.6;
    }

    /* ==================================
       ダークモード
       ================================== */

    body.dark-mode {
      background: #181818;
      color: #f1f1f1;
    }

    body.dark-mode .menu-button {
      background: #2a2a2a;
      color: #f1f1f1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    body.dark-mode .tile {
      background: #242424;
      color: #f1f1f1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    body.dark-mode .menu-panel {
      background: #202020;
      color: #f1f1f1;
      box-shadow: -4px 0 18px rgba(0, 0, 0, 0.35);
    }

    body.dark-mode .menu-item,
    body.dark-mode .sort-option {
      color: #f1f1f1;
    }

    body.dark-mode .menu-item:active,
    body.dark-mode .sort-option:active,
    body.dark-mode .sort-option.active {
      background: #303030;
    }

    body.dark-mode .menu-section {
      border-top-color: #3a3a3a;
    }

    body.dark-mode .menu-section-title {
      color: #aaa;
    }

    body.dark-mode .close-button {
      background: #303030;
      color: #f1f1f1;
    }

    body.dark-mode .dialog {
      background: #242424;
      color: #f1f1f1;
    }

    body.dark-mode .form-group input,
    body.dark-mode .edit-search input {
      background: #303030;
      color: #f1f1f1;
      border-color: #4a4a4a;
    }

    body.dark-mode .form-group input::placeholder,
    body.dark-mode .edit-search input::placeholder {
      color: #999;
    }

    body.dark-mode .cancel-button {
      background: #3a3a3a;
      color: #f1f1f1;
    }

    body.dark-mode .register-button,
    body.dark-mode .done-button {
      background: #f1f1f1;
      color: #202020;
    }

    body.dark-mode .backup-info {
      background: #303030;
    }

    body.dark-mode .restore-warning {
      background: #3a3322;
      color: #f1f1f1;
    }

    body.dark-mode .delete-button {
      background: #3a3a3a;
      color: #f1f1f1;
    }

    body.dark-mode .loading,
    body.dark-mode .empty {
      color: #aaa;
    }

    .theme-option {
      position: relative;
    }

    .theme-mark {
      width: 25px;
      margin-right: 5px;
    }

    /* ===== スクリーンショット風UI ===== */
    html, body { min-height: 100%; }
    body {
      background: #181818;
      color: #f5f5f5;
      padding-bottom: 105px;
      -webkit-tap-highlight-color: transparent;
    }
    .book-header {
      position: relative;
      width: 100%;
      height: 72px;
      border-bottom: 1px solid #3a3a3a;
      background: #181818;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 24px;
    }
    .book-tabs {
      width: 100%;
      height: 54px;
      display: flex;
      align-items: center;
    }
    .tab-back {
      width: 68px;
      height: 44px;
      border: 0;
      background: transparent;
      color: #aaa;
      font-size: 23px;
      letter-spacing: 3px;
      cursor: pointer;
    }
    .tab-divider { display: none !important; }
    .tab-title {
      flex: 1;
      text-align: center;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
    }
    .tab-current {
      width: 300px;
      max-width: 38vw;
      height: 46px;
      border: 0;
      border-radius: 9px 9px 0 0;
      background: #202020;
      color: #f4f4f4;
      font-size: 21px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
    }
    .tab-current span { color: #bbb; font-size: 29px; margin-left: 8px; font-weight: 400; }
    .theme-toggle {
      position: absolute;
      right: 24px;
      top: 83px;
      width: 88px;
      height: 58px;
      border: 1px solid #4a4a4a;
      border-radius: 30px;
      background: #303030;
      font-size: 28px;
      cursor: pointer;
      z-index: 10;
    }
    .normal-header { display: none !important; }
    .container {
      max-width: none;
      width: 100%;
      padding: 20px 17px 105px;
    }
    .sort-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 24px;
      color: #cfcfcf;
    }
    .sort-label { font-size: 22px; font-weight: 600; }
    #sortSelect {
      min-width: 185px;
      height: 53px;
      padding: 0 38px 0 18px;
      border: 1px solid #4b4b4b;
      border-radius: 27px;
      background: #303030;
      color: #f4f4f4;
      font-size: 21px;
      font-weight: 700;
      outline: none;
    }
    .tiles { grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 12px; }
    .tile {
      aspect-ratio: 1 / .98;
      min-height: 184px;
      padding: 22px 10px 13px;
      background: #292929;
      color: #f6f6f6;
      border-radius: 21px;
      box-shadow: none;
      border: 1px solid #303030;
    }
    .icon { width: 94px; height: 94px; margin-bottom: 12px; font-size: 54px; }
    .icon img { width: 88px; height: 88px; border-radius: 16px; }
    .name { font-size: 16px; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; box-sizing: border-box; }
    .delete-button { width: 38px; height: 38px; top: 6px; right: 6px; background: #444; color: #eee; font-size: 22px; }
    .bottom-actions {
      position: fixed;
      left: 50%;
      bottom: 27px;
      transform: translateX(-50%);
      z-index: 1500;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border-radius: 44px;
      background: rgba(45,45,45,.96);
      box-shadow: 0 5px 20px rgba(0,0,0,.38);
      border: 1px solid #363636;
    }
    .sort-action {
      height: 58px;
      min-width: 142px;
      padding: 0 28px 0 18px;
      border: 1px solid #4b4b4b;
      border-radius: 30px;
      background: #303030;
      color: #f4f4f4;
      font-size: 18px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      white-space: nowrap;
    }
    html[data-theme="light"] .sort-action,
    body.light-mode .sort-action {
      background: #fff;
      color: #222;
      border-color: #d0d0d0;
    }
    .action-button {
      height: 58px;
      min-width: 142px;
      padding: 0 24px;
      border: 0;
      border-radius: 30px;
      color: white;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .action-button span { margin-right: 7px; font-size: 25px; }
    .add-action { background: #1688ee; }
    .save-action { background: #24ad5b; }
    .restore-action { background: #9b9b9b; }
    .menu-panel { background: #202020; color: #f1f1f1; }
    .menu-item, .sort-option { color: #f1f1f1; }
    .dialog { background: #242424; color: #f1f1f1; }
    .form-group input, .edit-search input { background: #303030; color: #f1f1f1; border-color: #4a4a4a; }
    @media (min-width: 1600px) {
      .tiles { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    }

    @media (min-width: 2000px) {
      .tiles { grid-template-columns: repeat(14, minmax(0, 1fr)); }
    }

    @media (max-width: 600px) {
      .book-header { height: 62px; padding: 0 10px; }
      .book-tabs { height: 48px; }
      .tab-back { width: 48px; font-size: 20px; }
      .tab-divider { margin: 0 9px 0 3px; height: 32px; }
      .tab-title { font-size: 25px; }
      .tab-current { width: 175px; max-width: 32vw; height: 43px; font-size: 18px; }
      .tab-current span { font-size: 25px; }
      .theme-toggle { top: 74px; right: 24px; width: 72px; height: 54px; font-size: 25px; }
      /* スマホだけヘッダー下の不要な空白を詰める */
      .container { padding: 0 17px 105px; }
      .sort-label { font-size: 20px; }
      #sortSelect { min-width: 177px; height: 52px; font-size: 19px; }
      .tiles { gap: 15px; }
      .tile { min-height: 0; padding: 19px 7px 12px; border-radius: 19px; }
      .icon { width: 82px; height: 82px; margin-bottom: 9px; }
      .icon img { width: 78px; height: 78px; }
      .name { font-size: 15px; }
      .bottom-actions { bottom: 23px; padding: 9px 10px; gap: 8px; }
      .action-button { width: 112px; height: 55px; padding: 0 10px; font-size: 19px; }
    }


    /* テーマをbodyクラスだけに依存せず、HTML属性でも明示 */
    html[data-theme="light"] body {
      background: #f5f5f5 !important;
      color: #222 !important;
    }
    html[data-theme="dark"] body {
      background: #1b1b1d !important;
      color: #f1f1f1 !important;
    }
    html[data-theme="light"] .book-header { background: #f5f5f5 !important; border-bottom-color: #d8d8d8 !important; }
    html[data-theme="light"] .tab-title { color: #222 !important; }
    html[data-theme="light"] .tab-back { color: #666 !important; }
    html[data-theme="light"] .tab-current { background: #fff !important; color: #222 !important; }
    html[data-theme="light"] .sort-bar { color: #555 !important; }
    html[data-theme="light"] #sortSelect { background: #fff !important; color: #222 !important; border-color: #d0d0d0 !important; }
    html[data-theme="light"] .tile { background: #fff !important; color: #222 !important; border-color: #e4e4e4 !important; }
    html[data-theme="light"] .bottom-actions { background: rgba(255,255,255,.97) !important; border-color: #ddd !important; }
    html[data-theme="light"] .theme-toggle { background: #fff !important; color: #222 !important; border-color: #d2d2d2 !important; }
    html[data-theme="light"] .delete-button { background: #e7e7e7 !important; color: #444 !important; }
    html[data-theme="light"] .empty, html[data-theme="light"] .loading { color: #555 !important; }


    /* テーマ切替を端末ブラウザでも確実に反映 */
    html[data-theme="dark"] { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    .theme-toggle { touch-action: manipulation; -webkit-user-select: none; user-select: none; }

    /* ===== テーマ切替・スマホ最適化 ===== */
    body.light-mode {
      background: #f5f5f5;
      color: #222;
    }
    body.light-mode .book-header {
      background: #f5f5f5;
      border-bottom-color: #d8d8d8;
    }
    body.light-mode .tab-back { color: #666; }
    body.light-mode .tab-divider { background: #c8c8c8; }
    body.light-mode .tab-title { color: #222; }
    body.light-mode .tab-current {
      background: #fff;
      color: #222;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    body.light-mode .theme-toggle {
      background: #fff;
      border-color: #d2d2d2;
      color: #222;
    }
    body.light-mode .sort-bar { color: #555; }
    body.light-mode #sortSelect {
      background: #fff;
      color: #222;
      border-color: #d0d0d0;
    }
    body.light-mode .tile {
      background: #fff;
      color: #222;
      border-color: #e4e4e4;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    body.light-mode .bottom-actions {
      background: rgba(255,255,255,.96);
      border-color: #ddd;
      box-shadow: 0 4px 18px rgba(0,0,0,.16);
    }

    @media (max-width: 600px) {
      .book-header { height: 62px; padding: 0 8px; }
      .book-tabs { height: 48px; }
      .tab-back { width: 42px; font-size: 18px; }
      .tab-divider { display: none !important; }
      .tab-title { font-size: 22px; }
      .tab-current { width: 150px; max-width: 38vw; height: 40px; font-size: 16px; }
      .tab-current span { font-size: 22px; margin-left: 4px; }
      .theme-toggle {
        top: 68px;
        right: 12px;
        width: 58px;
        height: 42px;
        border-radius: 22px;
        font-size: 20px;
      }
      .container { padding: 12px 12px 76px; }
      .sort-bar { gap: 6px; margin-bottom: 16px; }
      .sort-label { font-size: 16px; }
      #sortSelect {
        min-width: 0;
        width: 155px;
        height: 42px;
        padding: 0 30px 0 12px;
        border-radius: 22px;
        font-size: 16px;
      }
      .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
      .tile { padding: 8px 4px 8px; border-radius: 15px; justify-content: flex-start; }
      .icon { width: 52px; height: 52px; margin-bottom: 5px; font-size: 34px; flex-shrink: 0; }
      .icon img { width: 48px; height: 48px; border-radius: 10px; }
      .name { display: block; width: 100%; min-width: 0; font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; color: inherit; }
      /* 4列スマホでもサイト名の文字下端が切れないようにする */
      .tile {
        box-sizing: border-box;
        overflow: visible;
        min-height: 0;
        height: auto;
        aspect-ratio: 1 / 1;
      }
      .tile .icon {
        flex: 0 0 52px;
      }
      .tile .name {
        flex: 0 0 auto;
        height: auto;
        min-height: 14px;
        line-height: 14px;
        padding: 0;
        margin: 0;
      }
      .delete-button { width: 30px; height: 30px; font-size: 18px; }
      .bottom-actions {
        left: 50%;
        right: auto;
        bottom: max(8px, env(safe-area-inset-bottom));
        width: calc(100vw - 24px);
        max-width: 420px;
        box-sizing: border-box;
        transform: translateX(-50%);
        gap: 4px;
        padding: 5px;
        border-radius: 22px;
      }
      .action-button {
        flex: 1 1 0;
        width: 0;
        min-width: 0;
        height: 38px;
        padding: 0 2px;
        border-radius: 19px;
        font-size: 13px;
        letter-spacing: -0.02em;
      }
      .action-button span { margin-right: 2px; font-size: 15px; }
    }

  
    /* ===== 下部操作：並び順を追加・保存・復元と横並びにする ===== */
    @media (max-width: 600px) {
      .bottom-actions {
        width: calc(100vw - 16px);
        max-width: 420px;
        gap: 4px;
        padding: 5px;
      }
      .bottom-actions .sort-action,
      .bottom-actions .action-button {
        flex: 1 1 0;
        width: 0;

        height: 38px;

      }
      .bottom-actions .action-button span {

    }

    /* ===== 表示モード変更ボタン：ヘッダー内でタイトルと同じ高さに配置 ===== */
    .book-header .theme-toggle {

      transform: translateY(-50%);

    @media (max-width: 600px) {

    /* ===== PC：列数が多い画面でもアイコンが絶対に隣のタイルへはみ出さない ===== */
    @media (min-width: 700px) {

        box-sizing: border-box;

      .tile .icon {

    }

</head>

<body>

  <script>

    /* ==================================
       基本設定
       ================================== */

    let favorites = [];

    let currentSort =
      localStorage.getItem(
        "favoriteSort"
      ) || "most";

    // 現在の検索条件を保持して、並び順変更時にも同じ条件で即時再描画する
    let currentSearchKeyword = "";

    if (currentSort === "recent") {
      currentSort = "most";
      localStorage.setItem("favoriteSort", currentSort);
    }

    if (currentSort === "oldest") {
      currentSort = "least";
      localStorage.setItem("favoriteSort", currentSort);
    }

    let editMode = false;

    let restoreData = null;


    /* ==================================
       保存
       ================================== */

    function saveFavorites() {

      localStorage.setItem(
        "myFavorites",
        JSON.stringify(
          favorites
        )
      );

    }


    /* ==================================
       URLを安全に整える
       ================================== */

    function normalizeUrl(url) {

      if (!url) {
        return "";
      }

      url = url.trim();

      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {
        url =
          "https://" + url;
      }

      return url;

    }


    /* ==================================
       ファビコン候補
       ================================== */

    function getFaviconCandidates(url) {

      const candidates = [];

      try {

        const parsed =
          new URL(
            normalizeUrl(url)
          );

        const origin =
          parsed.origin;


        candidates.push(
          origin + "/favicon.ico"
        );

        candidates.push(
          origin + "/favicon.png"
        );

        candidates.push(
          origin + "/apple-touch-icon.png"
        );

      }

      catch (error) {

        console.error(
          "URL解析エラー:",
          error
        );

      }


      return [
        ...new Set(
          candidates
        )
      ];

    }


    /* ==================================
       初期ファビコンURL
       ================================== */

    function getFaviconUrl(url) {

      const candidates =
        getFaviconCandidates(
          url
        );

      return (
        candidates[0] || ""
      );

    }


    /* ==================================
       アイコン表示
       サイトのファビコンをカード内に表示
       ================================== */

    function createFaviconElement(item) {

      const icon = document.createElement("div");
      icon.className = "icon";

      const candidates = [];
      const addCandidate = (value) => {
        if (!value || typeof value !== "string") return;
        const v = value.trim();
        if (!v) return;
        candidates.push(v);
      };

      // 保存済みのアイコンを最優先
      if (item.icon && /^data:image\//i.test(String(item.icon).trim())) {
        addCandidate(String(item.icon).trim());
      } else if (item.icon && /^https?:\/\//i.test(String(item.icon).trim())) {
        addCandidate(String(item.icon).trim());
      }

      if (item.favicon && /^https?:\/\//i.test(String(item.favicon).trim())) {
        addCandidate(String(item.favicon).trim());
      }

      // サイト自身の favicon を順番に試す
      try {
        const parsed = new URL(normalizeUrl(item.url));
        const origin = parsed.origin;
        addCandidate(origin + "/favicon.ico");
        addCandidate(origin + "/favicon.png");
        addCandidate(origin + "/apple-touch-icon.png");
        addCandidate("https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(parsed.hostname));
      } catch (error) {
        console.warn("ファビコンURLを作成できません:", error);
      }

      const uniqueCandidates = [...new Set(candidates)];

      if (!uniqueCandidates.length) {
        icon.textContent = "🌐";
        return icon;
      }

      const img = document.createElement("img");
      img.alt = "";
      img.loading = "lazy";
      img.decoding = "async";
      img.referrerPolicy = "no-referrer";

      let index = 0;
      const tryNext = () => {
        if (index >= uniqueCandidates.length) {
          img.remove();
          icon.textContent = "🌐";
          return;
        }
        img.src = uniqueCandidates[index++];
      };

      img.onerror = tryNext;
      img.onload = () => {
        icon.classList.add("has-image");
      };
      icon.appendChild(img);
      tryNext();

      return icon;
    }

    /* ==================================
       並び替え
       ================================== */

    function sortFavorites(
      items
    ) {

      const sorted =
        [...items];


      if (
        currentSort ===
        "most"
      ) {

        sorted.sort(
          (a, b) =>
            (b.clickCount || 0) -
            (a.clickCount || 0)
        );

      }

      else if (
        currentSort ===
        "least"
      ) {

        sorted.sort(
          (a, b) =>
            (a.clickCount || 0) -
            (b.clickCount || 0)
        );

      }

      else if (
        currentSort ===
        "registered"
      ) {

        sorted.sort(
          (a, b) =>
            (a.registeredAt || 0) -
            (b.registeredAt || 0)
        );

      }

      else if (
        currentSort ===
        "name"
      ) {

        sorted.sort(
          (a, b) =>
            (a.name || "")
              .localeCompare(
                b.name || "",
                "ja"
              )
        );

      }


      return sorted;

    }


    /* ==================================
       データ読み込み
       ================================== */

    async function loadFavorites() {

      const saved = localStorage.getItem("myFavorites");

      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("保存データの形式が正しくありません。");

          const now = Date.now();
          favorites = parsed.map((item, index) => ({
            ...item,
            name: typeof item.name === "string" ? item.name : "お気に入り",
            url: normalizeUrl(item.url),
            registeredAt: item.registeredAt || (now + index),
            lastClicked: item.lastClicked || 0,
            clickCount: Number.isFinite(item.clickCount) ? item.clickCount : 0
          })).filter(item => item.url);

          saveFavorites();
          displayFavorites();
          return;
        } catch (error) {
          console.error("保存データの読み込みに失敗しました:", error);
        }
      }

      // 初回のみ favorites.json を読み込む。
      // file:// 直開き等で fetch が使えない場合も、空表示で正常起動する。
      try {
        const response = await fetch("favorites.json?v=" + Date.now(), { cache: "no-store" });
        if (!response.ok) throw new Error("favorites.jsonを読み込めませんでした");

        const data = await response.json();
        if (!Array.isArray(data)) throw new Error("favorites.jsonの形式が正しくありません");

        const now = Date.now();
        favorites = data.map((item, index) => ({
          ...item,
          name: typeof item.name === "string" ? item.name : "お気に入り",
          url: normalizeUrl(item.url),
          registeredAt: item.registeredAt || (now + index),
          lastClicked: item.lastClicked || 0,
          clickCount: Number.isFinite(item.clickCount) ? item.clickCount : 0
        })).filter(item => item.url);

        saveFavorites();
        displayFavorites();
      } catch (error) {
        // 初回データがない環境では「お気に入りがありません」と表示して起動を継続。
        favorites = [];
        displayFavorites();
        console.warn("初期データを読み込めませんでした:", error);
      }
    }

    /* ==================================
       表示
       ================================== */

    function displayFavorites(
      searchKeyword = currentSearchKeyword
    ) {

      // どの経路から再描画しても現在の検索条件を保持する
      currentSearchKeyword = searchKeyword || "";

      const container =
        document.getElementById(
          "favorites"
        );


      let items =
        favorites.filter(
          item =>
            (item.name || "")
              .toLowerCase()
              .includes(
                searchKeyword
                  .toLowerCase()
              )
        );


      items =
        sortFavorites(
          items
        );


      if (
        items.length === 0
      ) {

        container.innerHTML = `
          <div class="empty">
            お気に入りがありません。
          </div>
        `;

        return;

      }


      const tiles =
        document.createElement(
          "div"
        );

      tiles.className =
        "tiles";


      items.forEach(
        item => {

          const tile =
            document.createElement(
              "div"
            );

          tile.className =
            "tile";


          if (
            !editMode
          ) {

            tile.style.cursor =
              "pointer";


            tile.addEventListener(
              "click",
              function() {

                item.lastClicked =
                  Date.now();

                item.clickCount =
                  (item.clickCount || 0) + 1;

                saveFavorites();

                // 先に画面を並び替えてから、新しいタブを開く
                displayFavorites();

                setTimeout(function() {
                  window.open(
                    item.url,
                    "_blank",
                    "noopener,noreferrer"
                  );
                }, 50);

              }
            );

          }


          const icon =
            createFaviconElement(
              item
            );


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "name";

          name.textContent =
            String(item.name || "").slice(0, 6);
          name.title = String(item.name || "");


          tile.appendChild(
            icon
          );

          tile.appendChild(
            name
          );


          if (
            editMode
          ) {

            const deleteButton =
              document.createElement(
                "button"
              );

            deleteButton.className =
              "delete-button";

            deleteButton.textContent =
              "×";


            deleteButton.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();

                confirmDelete(
                  item
                );

              }
            );


            tile.appendChild(
              deleteButton
            );

          }


          tiles.appendChild(
            tile
          );

        }
      );


      container.innerHTML =
        "";

      container.appendChild(
        tiles
      );

    }


    /* ==================================
       メニュー
       ================================== */

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const menuOverlay =
      document.getElementById(
        "menuOverlay"
      );

    const closeMenuButton =
      document.getElementById(
        "closeMenuButton"
      );


    function openMenu() {

      menuOverlay.classList.add(
        "open"
      );

      updateSortButtons();

    }


    function closeMenu() {

      menuOverlay.classList.remove(
        "open"
      );

    }


    // 左上の「…」メニューボタンはUIから削除済み。
    // 存在しない要素へイベントを登録しない。


    closeMenuButton.addEventListener(
      "click",
      closeMenu
    );


    menuOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          menuOverlay
        ) {

          closeMenu();

        }

      }
    );


    /* ==================================
       表示モード
       ================================== */

    let currentTheme =
      localStorage.getItem(
        "favoriteTheme"
      ) || "dark";


    function applyTheme() {

      // iOSブラウザでも確実に即時反映するため、html属性とbodyクラスを同時更新
      document.documentElement.setAttribute("data-theme", currentTheme);
      document.body.classList.toggle("dark-mode", currentTheme === "dark");
      document.body.classList.toggle("light-mode", currentTheme === "light");

      updateThemeButtons();
      const toggle = document.getElementById("themeToggle");
      if (toggle) {
        toggle.textContent = currentTheme === "dark" ? "☀️" : "🌙";
        toggle.setAttribute("aria-label", currentTheme === "dark" ? "ライトモードに切替" : "ダークモードに切替");
      }

    }


    function updateThemeButtons() {

      const themeButtons =
        document.querySelectorAll(
          ".theme-option"
        );

      themeButtons.forEach(
        button => {

          const mark =
            button.querySelector(
              ".theme-mark"
            );

          if (
            button.dataset.theme ===
            currentTheme
          ) {

            mark.textContent =
              "●";

            button.classList.add(
              "active"
            );

          }

          else {

            mark.textContent =
              "○";

            button.classList.remove(
              "active"
            );

          }

        }
      );

    }


    document
      .querySelectorAll(
        ".theme-option"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            function() {

              currentTheme =
                this.dataset.theme;

              localStorage.setItem(
                "favoriteTheme",
                currentTheme
              );

              applyTheme();

            }
          );

        }
      );


    /* ==================================
       並び順
       ================================== */

    const sortButtons =
      document.querySelectorAll(
        ".sort-option[data-sort]"
      );


    sortButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            currentSort =
              this.dataset.sort;


            localStorage.setItem(
              "favoriteSort",
              currentSort
            );


            updateSortButtons();

            // 並び順変更直後に、現在の検索条件のまま再描画する
            displayFavorites(currentSearchKeyword);

          }
        );

      }
    );


    function updateSortButtons() {

      const select = document.getElementById("sortSelect");
      if (select) select.value = currentSort;

      sortButtons.forEach(
        button => {

          const mark =
            button.querySelector(
              ".sort-mark"
            );


          if (
            button.dataset.sort ===
            currentSort
          ) {

            mark.textContent =
              "●";

            button.classList.add(
              "active"
            );

          }

          else {

            mark.textContent =
              "○";

            button.classList.remove(
              "active"
            );

          }

        }
      );

    }


    /* ==================================
       登録
       ================================== */

    const registerDialog =
      document.getElementById(
        "registerDialog"
      );

    const nameInput =
      document.getElementById(
        "nameInput"
      );

    const urlInput =
      document.getElementById(
        "urlInput"
      );


    document
      .getElementById(
        "openRegisterButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          nameInput.value =
            "";

          urlInput.value =
            "";

          registerDialog.classList.add(
            "open"
          );

          setTimeout(
            () =>
              nameInput.focus(),
            100
          );

        }
      );


    document
      .getElementById(
        "cancelRegisterButton"
      )
      .addEventListener(
        "click",
        function() {

          registerDialog.classList.remove(
            "open"
          );

        }
      );


    document
      .getElementById(
        "registerButton"
      )
      .addEventListener(
        "click",
        function() {

          const name =
            nameInput.value.trim().slice(0, 6);

          const url =
            normalizeUrl(
              urlInput.value
            );


          if (
            !name
          ) {

            alert(
              "サイト名を入力してください。"
            );

            return;

          }


          if (
            !url
          ) {

            alert(
              "URLを入力してください。"
            );

            return;

          }


          const now =
            Date.now();


          favorites.push({

            name:
              name,

            url:
              url,

            icon:
              "🌐",

            favicon:
              "",

            order:
              favorites.length + 1,

            registeredAt:
              now,

            lastClicked:
              0,

            clickCount:
              0

          });


          saveFavorites();


          registerDialog.classList.remove(
            "open"
          );


          displayFavorites();

        }
      );


    /* ==================================
       検索
       ================================== */

    const searchDialog =
      document.getElementById(
        "searchDialog"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    document
      .getElementById(
        "openSearchButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          searchInput.value =
            "";

          searchDialog.classList.add(
            "open"
          );

          setTimeout(
            () =>
              searchInput.focus(),
            100
          );

        }
      );


    document
      .getElementById(
        "closeSearchButton"
      )
      .addEventListener(
        "click",
        function() {

          searchDialog.classList.remove(
            "open"
          );

          displayFavorites();

        }
      );


    searchInput.addEventListener(
      "input",
      function() {

        currentSearchKeyword = this.value || "";
        displayFavorites(
          currentSearchKeyword
        );

      }
    );


    /* ==================================
       編集モード
       ================================== */

    const normalHeader =
      document.getElementById(
        "normalHeader"
      );

    const editHeader =
      document.getElementById(
        "editHeader"
      );

    const editSearch =
      document.getElementById(
        "editSearch"
      );

    const editSearchInput =
      document.getElementById(
        "editSearchInput"
      );


    document
      .getElementById(
        "openEditButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          editMode =
            true;


          if (normalHeader) {
            normalHeader.classList.add("hidden");
          }

          editHeader.classList.add(
            "open"
          );

          editSearch.classList.add(
            "open"
          );


          editSearchInput.value =
            "";

          displayFavorites();

        }
      );


    document
      .getElementById(
        "doneButton"
      )
      .addEventListener(
        "click",
        function() {

          editMode =
            false;


          if (normalHeader) {
            normalHeader.classList.remove("hidden");
          }

          editHeader.classList.remove(
            "open"
          );

          editSearch.classList.remove(
            "open"
          );


          editSearchInput.value =
            "";


          displayFavorites();

        }
      );


    editSearchInput.addEventListener(
      "input",
      function() {

        currentSearchKeyword = this.value || "";
        displayFavorites(
          currentSearchKeyword
        );

      }
    );


    /* ==================================
       削除
       ================================== */

    function confirmDelete(
      item
    ) {

      const result =
        confirm(
          "「" +
          item.name +
          "」を削除しますか？"
        );


      if (
        !result
      ) {

        return;

      }


      favorites =
        favorites.filter(
          favorite =>
            favorite !== item
        );


      saveFavorites();


      displayFavorites(
        editSearchInput.value
      );

    }


    /* ==================================
       バックアップ
       ================================== */

    const backupDialog =
      document.getElementById(
        "backupDialog"
      );

    const backupCount =
      document.getElementById(
        "backupCount"
      );


    document
      .getElementById(
        "backupButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();


          backupCount.textContent =
            favorites.length;


          backupDialog.classList.add(
            "open"
          );

        }
      );


    document
      .getElementById(
        "closeBackupButton"
      )
      .addEventListener(
        "click",
        function() {

          backupDialog.classList.remove(
            "open"
          );

        }
      );


    document
      .getElementById(
        "createBackupButton"
      )
      .addEventListener(
        "click",
        function() {

          createBackup();

        }
      );


    function createBackup() {

      const backup = {

        version:
          1,

        createdAt:
          new Date().toISOString(),

        favorites:
          favorites

      };


      const json =
        JSON.stringify(
          backup,
          null,
          2
        );


      const blob =
        new Blob(
          [json],
          {
            type:
              "application/json"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const date =
        new Date();


      const filename =
        "my-favorites-backup-" +
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        ) +
        "-" +
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        ) +
        ".json";


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;

      link.download =
        filename;


      document.body.appendChild(
        link
      );

      link.click();

      link.remove();


      setTimeout(
        function() {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );


      alert(
        "バックアップファイルを作成しました。\n\n" +
        filename
      );

    }


    /* ==================================
       復元
       ================================== */

    const restoreDialog =
      document.getElementById(
        "restoreDialog"
      );

    const backupFile =
      document.getElementById(
        "backupFile"
      );

    const restoreInfo =
      document.getElementById(
        "restoreInfo"
      );

    const restoreConfirmButton =
      document.getElementById(
        "restoreConfirmButton"
      );


    document
      .getElementById(
        "restoreButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          restoreData =
            null;

          backupFile.value =
            "";

          restoreInfo.textContent =
            "バックアップファイルを選択してください。";

          restoreConfirmButton.disabled =
            true;

          restoreDialog.classList.add(
            "open"
          );

        }
      );


    document
      .getElementById(
        "closeRestoreButton"
      )
      .addEventListener(
        "click",
        function() {

          restoreDialog.classList.remove(
            "open"
          );

        }
      );


    backupFile.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (
          !file
        ) {

          restoreData =
            null;

          restoreConfirmButton.disabled =
            true;

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            try {

              const data =
                JSON.parse(
                  event.target.result
                );


              if (
                data &&
                Array.isArray(
                  data.favorites
                )
              ) {

                restoreData =
                  data.favorites;

              }

              else if (
                Array.isArray(
                  data
                )
              ) {

                restoreData =
                  data;

              }

              else {

                throw new Error(
                  "データ形式が正しくありません。"
                );

              }


              if (
                restoreData.length === 0
              ) {

                restoreInfo.textContent =
                  "お気に入りが0件のバックアップです。";

              }

              else {

                restoreInfo.innerHTML =
                  "バックアップ内のお気に入り： " +
                  "<strong>" +
                  restoreData.length +
                  "件</strong>";

              }


              restoreConfirmButton.disabled =
                false;

            }

            catch (error) {

              restoreData =
                null;

              restoreConfirmButton.disabled =
                true;

              restoreInfo.textContent =
                "このファイルは使用できません。";

              alert(
                "バックアップファイルを読み込めませんでした。"
              );

              console.error(
                error
              );

            }

          };


        reader.readAsText(
          file
        );

      }
    );


    /* ==================================
       復元実行
       ================================== */

    restoreConfirmButton.addEventListener(
      "click",
      function() {

        if (
          !Array.isArray(
            restoreData
          )
        ) {

          return;

        }


        const result =
          confirm(
            "現在のお気に入りを、\n" +
            restoreData.length +
            "件のバックアップデータに置き換えますか？\n\n" +
            "この操作は現在のデータを上書きします。"
          );


        if (
          !result
        ) {

          return;

        }


        const safetyBackup = {

          version:
            1,

          createdAt:
            new Date().toISOString(),

          favorites:
            favorites

        };


        localStorage.setItem(
          "myFavoritesBeforeRestore",
          JSON.stringify(
            safetyBackup
          )
        );


        favorites =
          restoreData.map(
            (item, index) => {

              const url =
                normalizeUrl(
                  item.url
                );


              return {

                ...item,

                url:
                  url,

                registeredAt:
                  item.registeredAt
                  ||
                  (
                    Date.now() +
                    index
                  ),

                lastClicked:
                  item.lastClicked
                  ||
                  0,

                clickCount:
                  Number.isFinite(
                    item.clickCount
                  )
                  ?
                  item.clickCount
                  :
                  0,

                favicon:
                  item.favicon
                  ||
                  ""

              };

            }
          );


        saveFavorites();


        restoreDialog.classList.remove(
          "open"
        );


        displayFavorites();


        alert(
          "バックアップから復元しました。"
        );

      }
    );



    /* ===== 新UI操作 ===== */
    const sortSelect = document.getElementById("sortSelect");
    if (sortSelect) {
      sortSelect.value = currentSort;
      sortSelect.addEventListener("change", function () {
        currentSort = this.value;
        localStorage.setItem("favoriteSort", currentSort);
        updateSortButtons();
        displayFavorites(currentSearchKeyword);
      });
    }

    const themeToggle = document.getElementById("themeToggle");
    if (themeToggle) {
      const toggleTheme = function (event) {
        if (event) event.preventDefault();
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        localStorage.setItem("favoriteTheme", currentTheme);
        applyTheme();
      };
      themeToggle.addEventListener("click", toggleTheme);
    }

    document.getElementById("bottomAddButton").addEventListener("click", function () {
      document.getElementById("openRegisterButton").click();
    });
    document.getElementById("bottomSaveButton").addEventListener("click", function () {
      document.getElementById("backupButton").click();
    });
    document.getElementById("bottomRestoreButton").addEventListener("click", function () {
      document.getElementById("restoreButton").click();
    });

    /* ==================================
       起動
       ================================== */

    applyTheme();

    loadFavorites();

  </script>

</body>
</html>
