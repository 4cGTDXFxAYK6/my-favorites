<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お気に入り</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
    }

    .favorites {
      display: grid;
      gap: 12px;
    }

    .favorite {
      display: block;
      padding: 18px;
      background: white;
      border-radius: 12px;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      font-size: 18px;
    }

    .favorite:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⭐ お気に入り</h1>

    <div class="favorites">

      <a class="favorite" href="https://www.google.com/" target="_blank">
        Google
      </a>

      <a class="favorite" href="https://drive.google.com/" target="_blank">
        Google Drive
      </a>

      <a class="favorite" href="https://www.youtube.com/" target="_blank">
        YouTube
      </a>

    </div>

  </div>

</body>
</html>
