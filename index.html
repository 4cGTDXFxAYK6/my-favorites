<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お気に入り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 24px;
      font-size: 28px;
    }

    .search-box {
      margin-bottom: 30px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    .category {
      margin-bottom: 30px;
    }

    .category-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 110px;
      padding: 15px;

      background: white;
      border-radius: 16px;

      text-decoration: none;
      color: #333;

      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);

      transition: transform 0.1s ease;
    }

    .tile:active {
      transform: scale(0.96);
    }

    .icon {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .name {
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .error {
      padding: 20px;
      background: white;
      border-radius: 12px;
      color: #c00;
      text-align: center;
    }

    @media (min-width: 700px) {
      .tiles {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>⭐ お気に入り</h1>

    <div class="search-box">
      <input
        type="search"
        id="search"
        placeholder="🔍 お気に入りを検索"
      >
    </div>

    <div id="favorites">
      <div class="loading">
        読み込み中...
      </div>
    </div>

  </div>

  <script>
    let favorites = [];

    async function loadFavorites() {
      try {
        const response = await fetch("favorites.json");

        if (!response.ok) {
          throw new Error("favorites.jsonを読み込めませんでした");
        }

        favorites = await response.json();

        displayFavorites();

      } catch (error) {

        document.getElementById("favorites").innerHTML = `
          <div class="error">
            お気に入りデータを読み込めませんでした。
          </div>
        `;

        console.error(error);
      }
    }

    function displayFavorites() {

      const keyword =
        document.getElementById("search").value
          .toLowerCase()
          .trim();

      const filtered = favorites.filter(item => {

        const name =
          (item.name || "").toLowerCase();

        const category =
          (item.category || "").toLowerCase();

        return (
          name.includes(keyword) ||
          category.includes(keyword)
        );
      });

      const container =
        document.getElementById("favorites");

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="loading">
            該当するお気に入りがありません。
          </div>
        `;
        return;
      }

      const categories = {};

      filtered.forEach(item => {

        if (!categories[item.category]) {
          categories[item.category] = [];
        }

        categories[item.category].push(item);
      });

      container.innerHTML = "";

      Object.keys(categories).forEach(category => {

        const section =
          document.createElement("section");

        section.className = "category";

        const title =
          document.createElement("div");

        title.className = "category-title";
        title.textContent = category;

        const tiles =
          document.createElement("div");

        tiles.className = "tiles";

        categories[category].forEach(item => {

          const link =
            document.createElement("a");

          link.className = "tile";

          link.href = item.url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          link.innerHTML = `
            <div class="icon">
              ${item.icon || "🔗"}
            </div>

            <div class="name">
              ${item.name}
            </div>
          `;

          tiles.appendChild(link);
        });

        section.appendChild(title);
        section.appendChild(tiles);

        container.appendChild(section);
      });
    }

    document
      .getElementById("search")
      .addEventListener("input", displayFavorites);

    loadFavorites();
  </script>

</body>
</html>
