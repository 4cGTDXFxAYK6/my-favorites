<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>お気に入り</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    /* ==================================
       ヘッダー
       ================================== */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 14px 16px 10px;
    }

    .title {
      margin: 0;

      font-size: 22px;
      font-weight: 700;
    }

    .menu-button {
      width: 42px;
      height: 42px;

      border: none;
      border-radius: 12px;

      background: white;

      font-size: 24px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* ==================================
       メイン
       ================================== */

    .container {
      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 6px 12px 30px;
    }

    /* ==================================
       タイル
       ================================== */

    .tiles {
      display: grid;

      /* スマホ：4列 */
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
    }

    .tile {
      position: relative;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      /*
       * 正方形にする
       */
      aspect-ratio: 1 / 1;

      min-width: 0;

      padding: 7px;

      background: white;

      border-radius: 13px;

      text-decoration: none;

      color: #333;

      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.07);

      transition:
        transform 0.1s ease;
    }

    .tile:active {
      transform: scale(0.95);
    }

    /* ==================================
       ファビコン
       ================================== */

    .icon {
      width: 34px;
      height: 34px;

      margin-bottom: 4px;

      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      font-size: 25px;
    }

    .icon img {
      width: 32px;
      height: 32px;

      object-fit: contain;

      border-radius: 6px;
    }

    /* ==================================
       サイト名
       ================================== */

    .name {
      width: 100%;

      font-size: 12px;
      font-weight: 600;

      line-height: 1.25;

      text-align: center;

      word-break: break-word;

      overflow-wrap: anywhere;
    }

    /* ==================================
       読み込み・空表示
       ================================== */

    .loading {
      text-align: center;

      padding: 40px 20px;

      color: #777;
    }

    .empty {
      text-align: center;

      padding: 50px 20px;

      color: #777;
    }

    /* ==================================
       PC
       ================================== */

    @media (min-width: 700px) {

      .container {
        padding-left: 20px;
        padding-right: 20px;
      }

      .tiles {
        /*
         * PCは画面幅に合わせて自動調整
         *
         * 1タイルが120pxより小さく
         * ならないようにする
         */
        grid-template-columns:
          repeat(
            auto-fit,
            minmax(120px, 1fr)
          );

        gap: 12px;
      }

      .tile {
        padding: 10px;
      }

      .icon {
        width: 42px;
        height: 42px;

        margin-bottom: 6px;

        font-size: 30px;
      }

      .icon img {
        width: 38px;
        height: 38px;
      }

      .name {
        font-size: 14px;
      }

    }

    /* ==================================
       メニュー
       ================================== */

    .menu-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.25);

      display: none;

      z-index: 1000;
    }

    .menu-overlay.open {
      display: block;
    }

    .menu-panel {
      position: absolute;

      top: 0;
      right: 0;

      width:
        min(330px, 88vw);

      height: 100%;

      padding: 22px 18px;

      background: white;

      box-shadow:
        -4px 0 18px rgba(0, 0, 0, 0.15);

      overflow-y: auto;
    }

    .menu-header {
      display: flex;

      align-items: center;
      justify-content: space-between;

      margin-bottom: 20px;
    }

    .menu-title {
      font-size: 20px;

      font-weight: 700;
    }

    .close-button {
      width: 40px;
      height: 40px;

      border: none;

      border-radius: 10px;

      background: #f2f2f2;

      font-size: 21px;

      cursor: pointer;
    }

    .menu-item {
      width: 100%;

      display: flex;

      align-items: center;

      padding: 14px 11px;

      border: none;

      border-radius: 10px;

      background: transparent;

      font-size: 16px;

      text-align: left;

      cursor: pointer;
    }

    .menu-item:active {
      background: #f0f0f0;
    }

    .menu-section {
      margin-top: 20px;

      padding-top: 16px;

      border-top:
        1px solid #eee;
    }

    .menu-section-title {
      margin:
        0 0 7px 11px;

      font-size: 13px;

      color: #777;
    }

    .sort-option {
      width: 100%;

      display: flex;

      align-items: center;

      padding: 11px;

      border: none;

      border-radius: 10px;

      background: transparent;

      font-size: 15px;

      cursor: pointer;

      text-align: left;
    }

    .sort-option:active {
      background: #f0f0f0;
    }

    .sort-option.active {
      font-weight: 700;

      background: #f2f2f2;
    }

    .sort-mark {
      width: 25px;

      margin-right: 5px;
    }

    /* ==================================
       ダイアログ
       ================================== */

    .dialog-overlay {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background:
        rgba(0, 0, 0, 0.35);

      z-index: 2000;
    }

    .dialog-overlay.open {
      display: flex;
    }

    .dialog {
      width:
        min(450px, 100%);

      padding: 23px;

      background: white;

      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.2);
    }

    .dialog h2 {
      margin:
        0 0 19px;

      font-size: 21px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;

      margin-bottom: 7px;

      font-size: 14px;

      font-weight: 600;
    }

    .form-group input {
      width: 100%;

      padding: 12px 13px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;
    }

    .form-group input:focus {
      border-color: #888;
    }

    .dialog-buttons {
      display: flex;

      gap: 10px;

      margin-top: 21px;
    }

    .dialog-button {
      flex: 1;

      padding: 13px;

      border: none;

      border-radius: 10px;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    .cancel-button {
      background: #eee;
    }

    .register-button {
      background: #333;

      color: white;
    }

    /* ==================================
       編集モード
       ================================== */

    .delete-button {
      position: absolute;

      top: 5px;
      right: 5px;

      width: 29px;
      height: 29px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: none;

      border-radius: 50%;

      background: #eee;

      font-size: 16px;

      cursor: pointer;

      z-index: 5;
    }

    .delete-button:active {
      transform: scale(0.9);
    }

    .edit-header {
      display: none;

      align-items: center;
      justify-content: space-between;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding: 14px 16px 10px;
    }

    .edit-header.open {
      display: flex;
    }

    .edit-title {
      font-size: 20px;

      font-weight: 700;
    }

    .done-button {
      padding: 9px 14px;

      border: none;

      border-radius: 10px;

      background: #333;

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    .edit-search {
      display: none;

      width: 100%;
      max-width: 1200px;

      margin: 0 auto;

      padding:
        4px 16px 14px;
    }

    .edit-search.open {
      display: block;
    }

    .edit-search input {
      width: 100%;

      padding: 11px 14px;

      border:
        1px solid #ddd;

      border-radius: 12px;

      background: white;

      font-size: 16px;

      outline: none;
    }

    .normal-header.hidden {
      display: none;
    }

    /* ==================================
       バックアップ
       ================================== */

    .backup-info {
      padding: 13px;

      background: #f7f7f7;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.6;
    }

    .backup-count {
      font-weight: 700;
    }

    .file-input {
      width: 100%;

      padding: 10px 0;

      font-size: 15px;
    }

    .restore-warning {
      margin-top: 12px;

      padding: 12px;

      background: #fff8e1;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.6;
    }

    /* ==================================
       ダークモード
       ================================== */

    body.dark-mode {
      background: #181818;
      color: #f1f1f1;
    }

    body.dark-mode .menu-button {
      background: #2a2a2a;
      color: #f1f1f1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    body.dark-mode .tile {
      background: #242424;
      color: #f1f1f1;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
    }

    body.dark-mode .menu-panel {
      background: #202020;
      color: #f1f1f1;
      box-shadow: -4px 0 18px rgba(0, 0, 0, 0.35);
    }

    body.dark-mode .menu-item,
    body.dark-mode .sort-option {
      color: #f1f1f1;
    }

    body.dark-mode .menu-item:active,
    body.dark-mode .sort-option:active,
    body.dark-mode .sort-option.active {
      background: #303030;
    }

    body.dark-mode .menu-section {
      border-top-color: #3a3a3a;
    }

    body.dark-mode .menu-section-title {
      color: #aaa;
    }

    body.dark-mode .close-button {
      background: #303030;
      color: #f1f1f1;
    }

    body.dark-mode .dialog {
      background: #242424;
      color: #f1f1f1;
    }

    body.dark-mode .form-group input,
    body.dark-mode .edit-search input {
      background: #303030;
      color: #f1f1f1;
      border-color: #4a4a4a;
    }

    body.dark-mode .form-group input::placeholder,
    body.dark-mode .edit-search input::placeholder {
      color: #999;
    }

    body.dark-mode .cancel-button {
      background: #3a3a3a;
      color: #f1f1f1;
    }

    body.dark-mode .register-button,
    body.dark-mode .done-button {
      background: #f1f1f1;
      color: #202020;
    }

    body.dark-mode .backup-info {
      background: #303030;
    }

    body.dark-mode .restore-warning {
      background: #3a3322;
      color: #f1f1f1;
    }

    body.dark-mode .delete-button {
      background: #3a3a3a;
      color: #f1f1f1;
    }

    body.dark-mode .loading,
    body.dark-mode .empty {
      color: #aaa;
    }

    .theme-option {
      position: relative;
    }

    .theme-mark {
      width: 25px;
      margin-right: 5px;
    }
  </style>
</head>

<body>

  <!-- ==================================
       通常ヘッダー
       ================================== -->

  <header
    class="header normal-header"
    id="normalHeader"
  >

    <h1 class="title">
      ⭐ お気に入り
    </h1>

    <button
      class="menu-button"
      id="menuButton"
      aria-label="メニュー"
    >
      ☰
    </button>

  </header>


  <!-- ==================================
       編集ヘッダー
       ================================== -->

  <header
    class="edit-header"
    id="editHeader"
  >

    <div class="edit-title">
      ✏️ お気に入りを編集
    </div>

    <button
      class="done-button"
      id="doneButton"
    >
      ✓ 完了
    </button>

  </header>


  <!-- ==================================
       編集検索
       ================================== -->

  <div
    class="edit-search"
    id="editSearch"
  >

    <input
      type="search"
      id="editSearchInput"
      placeholder="🔍 編集するお気に入りを検索"
    >

  </div>


  <!-- ==================================
       メイン
       ================================== -->

  <main class="container">

    <div id="favorites">

      <div class="loading">
        読み込み中...
      </div>

    </div>

  </main>


  <!-- ==================================
       メニュー
       ================================== -->

  <div
    class="menu-overlay"
    id="menuOverlay"
  >

    <div class="menu-panel">

      <div class="menu-header">

        <div class="menu-title">
          メニュー
        </div>

        <button
          class="close-button"
          id="closeMenuButton"
        >
          ✕
        </button>

      </div>


      <button
        class="menu-item"
        id="openRegisterButton"
      >
        ＋　お気に入りを登録
      </button>


      <button
        class="menu-item"
        id="openSearchButton"
      >
        🔍　お気に入りを検索
      </button>


      <button
        class="menu-item"
        id="openEditButton"
      >
        ✏️　編集モード
      </button>


      <div class="menu-section">

        <div class="menu-section-title">
          並び順
        </div>


        <button
          class="sort-option"
          data-sort="recent"
        >
          <span class="sort-mark"></span>
          クリックした順（新しい順）
        </button>


        <button
          class="sort-option"
          data-sort="oldest"
        >
          <span class="sort-mark"></span>
          クリックした順（古い順）
        </button>


        <button
          class="sort-option"
          data-sort="registered"
        >
          <span class="sort-mark"></span>
          登録した順
        </button>


        <button
          class="sort-option"
          data-sort="name"
        >
          <span class="sort-mark"></span>
          五十音順
        </button>

      </div>


      <!-- ==================================
           データ管理
           ================================== -->

      <div class="menu-section">

        <div class="menu-section-title">
          表示モード
        </div>

        <button
          class="sort-option theme-option"
          data-theme="light"
        >
          <span class="theme-mark"></span>
          ☀️ ライトモード
        </button>

        <button
          class="sort-option theme-option"
          data-theme="dark"
        >
          <span class="theme-mark"></span>
          🌙 ダークモード
        </button>

      </div>


      <div class="menu-section">

        <div class="menu-section-title">
          データ管理
        </div>


        <button
          class="menu-item"
          id="backupButton"
        >
          💾　バックアップ
        </button>


        <button
          class="menu-item"
          id="restoreButton"
        >
          📂　バックアップから復元
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================
       登録ダイアログ
       ================================== -->

  <div
    class="dialog-overlay"
    id="registerDialog"
  >

    <div class="dialog">

      <h2>
        お気に入りを登録
      </h2>


      <div class="form-group">

        <label for="nameInput">
          サイト名
        </label>

        <input
          type="text"
          id="nameInput"
          placeholder="例：Google"
        >

      </div>


      <div class="form-group">

        <label for="urlInput">
          URL
        </label>

        <input
          type="url"
          id="urlInput"
          placeholder="https://example.com/"
        >

      </div>


      <div class="dialog-buttons">

        <button
          class="dialog-button cancel-button"
          id="cancelRegisterButton"
        >
          キャンセル
        </button>

        <button
          class="dialog-button register-button"
          id="registerButton"
        >
          登録
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================
       検索ダイアログ
       ================================== -->

  <div
    class="dialog-overlay"
    id="searchDialog"
  >

    <div class="dialog">

      <h2>
        お気に入りを検索
      </h2>


      <div class="form-group">

        <label for="searchInput">
          キーワード
        </label>

        <input
          type="search"
          id="searchInput"
          placeholder="サイト名を入力"
        >

      </div>


      <div class="dialog-buttons">

        <button
          class="dialog-button cancel-button"
          id="closeSearchButton"
        >
          閉じる
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================
       バックアップダイアログ
       ================================== -->

  <div
    class="dialog-overlay"
    id="backupDialog"
  >

    <div class="dialog">

      <h2>
        💾 バックアップ
      </h2>


      <div class="backup-info">

        現在登録されているお気に入り：

        <span
          class="backup-count"
          id="backupCount"
        >
          0
        </span>

        件

      </div>


      <div class="restore-warning">

        バックアップファイルには、
        お気に入りの名前・URL・並び順などが
        保存されます。

      </div>


      <div class="dialog-buttons">

        <button
          class="dialog-button cancel-button"
          id="closeBackupButton"
        >
          閉じる
        </button>

        <button
          class="dialog-button register-button"
          id="createBackupButton"
        >
          ファイルを作成
        </button>

      </div>

    </div>

  </div>


  <!-- ==================================
       復元ダイアログ
       ================================== -->

  <div
    class="dialog-overlay"
    id="restoreDialog"
  >

    <div class="dialog">

      <h2>
        📂 バックアップから復元
      </h2>


      <div class="form-group">

        <label for="backupFile">
          バックアップファイル
        </label>

        <input
          type="file"
          id="backupFile"
          class="file-input"
          accept=".json,application/json"
        >

      </div>


      <div
        class="backup-info"
        id="restoreInfo"
      >
        バックアップファイルを
        選択してください。
      </div>


      <div class="restore-warning">

        ⚠️ 復元すると、現在のお気に入りが
        バックアップの内容に置き換わります。

        <br><br>

        復元前に、現在のデータを
        バックアップしておくことをおすすめします。

      </div>


      <div class="dialog-buttons">

        <button
          class="dialog-button cancel-button"
          id="closeRestoreButton"
        >
          キャンセル
        </button>

        <button
          class="dialog-button register-button"
          id="restoreConfirmButton"
          disabled
        >
          復元する
        </button>

      </div>

    </div>

  </div>


  <script>

    /* ==================================
       基本設定
       ================================== */

    let favorites = [];

    let currentSort =
      localStorage.getItem(
        "favoriteSort"
      ) || "recent";

    let editMode = false;

    let restoreData = null;


    /* ==================================
       保存
       ================================== */

    function saveFavorites() {

      localStorage.setItem(
        "myFavorites",
        JSON.stringify(
          favorites
        )
      );

    }


    /* ==================================
       URLを安全に整える
       ================================== */

    function normalizeUrl(url) {

      if (!url) {
        return "";
      }

      url = url.trim();

      if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
      ) {
        url =
          "https://" + url;
      }

      return url;

    }


    /* ==================================
       ファビコン候補
       ================================== */

    function getFaviconCandidates(url) {

      const candidates = [];

      try {

        const parsed =
          new URL(
            normalizeUrl(url)
          );

        const origin =
          parsed.origin;


        candidates.push(
          origin + "/favicon.ico"
        );

        candidates.push(
          origin + "/favicon.png"
        );

        candidates.push(
          origin + "/apple-touch-icon.png"
        );

      }

      catch (error) {

        console.error(
          "URL解析エラー:",
          error
        );

      }


      return [
        ...new Set(
          candidates
        )
      ];

    }


    /* ==================================
       初期ファビコンURL
       ================================== */

    function getFaviconUrl(url) {

      const candidates =
        getFaviconCandidates(
          url
        );

      return (
        candidates[0] || ""
      );

    }


    /* ==================================
       ファビコン表示
       ================================== */

    function createFaviconElement(
      item
    ) {

      const icon =
        document.createElement(
          "div"
        );

      icon.className =
        "icon";


      let candidates =
        getFaviconCandidates(
          item.url
        );


      if (
        item.favicon
      ) {

        candidates =
          [
            item.favicon,
            ...candidates
          ];

      }


      candidates =
        [
          ...new Set(
            candidates.filter(
              Boolean
            )
          )
        ];


      let index = 0;


      function tryNext() {

        if (
          index >=
          candidates.length
        ) {

          icon.textContent =
            item.icon ||
            "🌐";

          return;

        }


        const img =
          document.createElement(
            "img"
          );


        const candidate =
          candidates[index];


        index++;


        img.src =
          candidate;

        img.alt =
          "";


        img.onload =
          function() {

            if (
              item.favicon !==
              candidate
            ) {

              item.favicon =
                candidate;

              saveFavorites();

            }

          };


        img.onerror =
          function() {

            img.remove();

            tryNext();

          };


        icon.appendChild(
          img
        );

      }


      tryNext();


      return icon;

    }


    /* ==================================
       データ読み込み
       ================================== */

    async function loadFavorites() {

      const saved =
        localStorage.getItem(
          "myFavorites"
        );


      if (saved) {

        try {

          favorites =
            JSON.parse(
              saved
            );


          favorites =
            favorites.map(
              (item, index) => {

                return {

                  ...item,

                  url:
                    normalizeUrl(
                      item.url
                    ),

                  registeredAt:
                    item.registeredAt
                    ||
                    (
                      Date.now() +
                      index
                    ),

                  lastClicked:
                    item.lastClicked
                    ||
                    0

                };

              }
            );


          saveFavorites();

          displayFavorites();

          return;

        }

        catch (error) {

          console.error(
            error
          );

        }

      }


      try {

        const response =
          await fetch(
            "favorites.json?v=" +
            Date.now()
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "favorites.jsonを読み込めませんでした"
          );

        }


        favorites =
          await response.json();


        const now =
          Date.now();


        favorites =
          favorites.map(
            (item, index) => {

              return {

                ...item,

                url:
                  normalizeUrl(
                    item.url
                  ),

                registeredAt:
                  item.registeredAt
                  ||
                  (
                    now +
                    index
                  ),

                lastClicked:
                  item.lastClicked
                  ||
                  0

              };

            }
          );


        saveFavorites();

        displayFavorites();

      }

      catch (error) {

        document.getElementById(
          "favorites"
        ).innerHTML = `
          <div class="empty">
            お気に入りデータを
            読み込めませんでした。
          </div>
        `;

        console.error(
          error
        );

      }

    }


    /* ==================================
       並び替え
       ================================== */

    function sortFavorites(
      items
    ) {

      const sorted =
        [...items];


      if (
        currentSort ===
        "recent"
      ) {

        sorted.sort(
          (a, b) =>
            (b.lastClicked || 0) -
            (a.lastClicked || 0)
        );

      }

      else if (
        currentSort ===
        "oldest"
      ) {

        sorted.sort(
          (a, b) =>
            (a.lastClicked || 0) -
            (b.lastClicked || 0)
        );

      }

      else if (
        currentSort ===
        "registered"
      ) {

        sorted.sort(
          (a, b) =>
            (a.registeredAt || 0) -
            (b.registeredAt || 0)
        );

      }

      else if (
        currentSort ===
        "name"
      ) {

        sorted.sort(
          (a, b) =>
            (a.name || "")
              .localeCompare(
                b.name || "",
                "ja"
              )
        );

      }


      return sorted;

    }


    /* ==================================
       表示
       ================================== */

    function displayFavorites(
      searchKeyword = ""
    ) {

      const container =
        document.getElementById(
          "favorites"
        );


      let items =
        favorites.filter(
          item =>
            (item.name || "")
              .toLowerCase()
              .includes(
                searchKeyword
                  .toLowerCase()
              )
        );


      items =
        sortFavorites(
          items
        );


      if (
        items.length === 0
      ) {

        container.innerHTML = `
          <div class="empty">
            お気に入りがありません。
          </div>
        `;

        return;

      }


      const tiles =
        document.createElement(
          "div"
        );

      tiles.className =
        "tiles";


      items.forEach(
        item => {

          const tile =
            document.createElement(
              "div"
            );

          tile.className =
            "tile";


          if (
            !editMode
          ) {

            tile.style.cursor =
              "pointer";


            tile.addEventListener(
              "click",
              function() {

                item.lastClicked =
                  Date.now();

                saveFavorites();


                window.open(
                  item.url,
                  "_blank",
                  "noopener,noreferrer"
                );

              }
            );

          }


          const icon =
            createFaviconElement(
              item
            );


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "name";

          name.textContent =
            item.name;


          tile.appendChild(
            icon
          );

          tile.appendChild(
            name
          );


          if (
            editMode
          ) {

            const deleteButton =
              document.createElement(
                "button"
              );

            deleteButton.className =
              "delete-button";

            deleteButton.textContent =
              "×";


            deleteButton.addEventListener(
              "click",
              function(event) {

                event.stopPropagation();

                confirmDelete(
                  item
                );

              }
            );


            tile.appendChild(
              deleteButton
            );

          }


          tiles.appendChild(
            tile
          );

        }
      );


      container.innerHTML =
        "";

      container.appendChild(
        tiles
      );

    }


    /* ==================================
       メニュー
       ================================== */

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const menuOverlay =
      document.getElementById(
        "menuOverlay"
      );

    const closeMenuButton =
      document.getElementById(
        "closeMenuButton"
      );


    function openMenu() {

      menuOverlay.classList.add(
        "open"
      );

      updateSortButtons();

    }


    function closeMenu() {

      menuOverlay.classList.remove(
        "open"
      );

    }


    menuButton.addEventListener(
      "click",
      openMenu
    );


    closeMenuButton.addEventListener(
      "click",
      closeMenu
    );


    menuOverlay.addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          menuOverlay
        ) {

          closeMenu();

        }

      }
    );


    /* ==================================
       表示モード
       ================================== */

    let currentTheme =
      localStorage.getItem(
        "favoriteTheme"
      ) || "light";


    function applyTheme() {

      if (currentTheme === "dark") {

        document.body.classList.add(
          "dark-mode"
        );

      }

      else {

        document.body.classList.remove(
          "dark-mode"
        );

      }

      updateThemeButtons();

    }


    function updateThemeButtons() {

      const themeButtons =
        document.querySelectorAll(
          ".theme-option"
        );

      themeButtons.forEach(
        button => {

          const mark =
            button.querySelector(
              ".theme-mark"
            );

          if (
            button.dataset.theme ===
            currentTheme
          ) {

            mark.textContent =
              "●";

            button.classList.add(
              "active"
            );

          }

          else {

            mark.textContent =
              "○";

            button.classList.remove(
              "active"
            );

          }

        }
      );

    }


    document
      .querySelectorAll(
        ".theme-option"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            function() {

              currentTheme =
                this.dataset.theme;

              localStorage.setItem(
                "favoriteTheme",
                currentTheme
              );

              applyTheme();

            }
          );

        }
      );


    /* ==================================
       並び順
       ================================== */

    const sortButtons =
      document.querySelectorAll(
        ".sort-option"
      );


    sortButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            currentSort =
              this.dataset.sort;


            localStorage.setItem(
              "favoriteSort",
              currentSort
            );


            updateSortButtons();

            displayFavorites();

          }
        );

      }
    );


    function updateSortButtons() {

      sortButtons.forEach(
        button => {

          const mark =
            button.querySelector(
              ".sort-mark"
            );


          if (
            button.dataset.sort ===
            currentSort
          ) {

            mark.textContent =
              "●";

            button.classList.add(
              "active"
            );

          }

          else {

            mark.textContent =
              "○";

            button.classList.remove(
              "active"
            );

          }

        }
      );

    }


    /* ==================================
       登録
       ================================== */

    const registerDialog =
      document.getElementById(
        "registerDialog"
      );

    const nameInput =
      document.getElementById(
        "nameInput"
      );

    const urlInput =
      document.getElementById(
        "urlInput"
      );


    document
      .getElementById(
        "openRegisterButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          nameInput.value =
            "";

          urlInput.value =
            "";

          registerDialog.classList.add(
            "open"
          );

          setTimeout(
            () =>
              nameInput.focus(),
            100
          );

        }
      );


    document
      .getElementById(
        "cancelRegisterButton"
      )
      .addEventListener(
        "click",
        function() {

          registerDialog.classList.remove(
            "open"
          );

        }
      );


    document
      .getElementById(
        "registerButton"
      )
      .addEventListener(
        "click",
        function() {

          const name =
            nameInput.value.trim();

          const url =
            normalizeUrl(
              urlInput.value
            );


          if (
            !name
          ) {

            alert(
              "サイト名を入力してください。"
            );

            return;

          }


          if (
            !url
          ) {

            alert(
              "URLを入力してください。"
            );

            return;

          }


          const now =
            Date.now();


          favorites.push({

            name:
              name,

            url:
              url,

            icon:
              "🌐",

            favicon:
              getFaviconUrl(
                url
              ),

            order:
              favorites.length + 1,

            registeredAt:
              now,

            lastClicked:
              now

          });


          saveFavorites();


          registerDialog.classList.remove(
            "open"
          );


          displayFavorites();

        }
      );


    /* ==================================
       検索
       ================================== */

    const searchDialog =
      document.getElementById(
        "searchDialog"
      );

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    document
      .getElementById(
        "openSearchButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          searchInput.value =
            "";

          searchDialog.classList.add(
            "open"
          );

          setTimeout(
            () =>
              searchInput.focus(),
            100
          );

        }
      );


    document
      .getElementById(
        "closeSearchButton"
      )
      .addEventListener(
        "click",
        function() {

          searchDialog.classList.remove(
            "open"
          );

          displayFavorites();

        }
      );


    searchInput.addEventListener(
      "input",
      function() {

        displayFavorites(
          this.value
        );

      }
    );


    /* ==================================
       編集モード
       ================================== */

    const normalHeader =
      document.getElementById(
        "normalHeader"
      );

    const editHeader =
      document.getElementById(
        "editHeader"
      );

    const editSearch =
      document.getElementById(
        "editSearch"
      );

    const editSearchInput =
      document.getElementById(
        "editSearchInput"
      );


    document
      .getElementById(
        "openEditButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          editMode =
            true;


          normalHeader.classList.add(
            "hidden"
          );

          editHeader.classList.add(
            "open"
          );

          editSearch.classList.add(
            "open"
          );


          editSearchInput.value =
            "";

          displayFavorites();

        }
      );


    document
      .getElementById(
        "doneButton"
      )
      .addEventListener(
        "click",
        function() {

          editMode =
            false;


          normalHeader.classList.remove(
            "hidden"
          );

          editHeader.classList.remove(
            "open"
          );

          editSearch.classList.remove(
            "open"
          );


          editSearchInput.value =
            "";


          displayFavorites();

        }
      );


    editSearchInput.addEventListener(
      "input",
      function() {

        displayFavorites(
          this.value
        );

      }
    );


    /* ==================================
       削除
       ================================== */

    function confirmDelete(
      item
    ) {

      const result =
        confirm(
          "「" +
          item.name +
          "」を削除しますか？"
        );


      if (
        !result
      ) {

        return;

      }


      favorites =
        favorites.filter(
          favorite =>
            favorite !== item
        );


      saveFavorites();


      displayFavorites(
        editSearchInput.value
      );

    }


    /* ==================================
       バックアップ
       ================================== */

    const backupDialog =
      document.getElementById(
        "backupDialog"
      );

    const backupCount =
      document.getElementById(
        "backupCount"
      );


    document
      .getElementById(
        "backupButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();


          backupCount.textContent =
            favorites.length;


          backupDialog.classList.add(
            "open"
          );

        }
      );


    document
      .getElementById(
        "closeBackupButton"
      )
      .addEventListener(
        "click",
        function() {

          backupDialog.classList.remove(
            "open"
          );

        }
      );


    document
      .getElementById(
        "createBackupButton"
      )
      .addEventListener(
        "click",
        function() {

          createBackup();

        }
      );


    function createBackup() {

      const backup = {

        version:
          1,

        createdAt:
          new Date().toISOString(),

        favorites:
          favorites

      };


      const json =
        JSON.stringify(
          backup,
          null,
          2
        );


      const blob =
        new Blob(
          [json],
          {
            type:
              "application/json"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const date =
        new Date();


      const filename =
        "my-favorites-backup-" +
        date.getFullYear() +
        "-" +
        String(
          date.getMonth() + 1
        ).padStart(
          2,
          "0"
        ) +
        "-" +
        String(
          date.getDate()
        ).padStart(
          2,
          "0"
        ) +
        ".json";


      const link =
        document.createElement(
          "a"
        );


      link.href =
        url;

      link.download =
        filename;


      document.body.appendChild(
        link
      );

      link.click();

      link.remove();


      setTimeout(
        function() {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );


      alert(
        "バックアップファイルを作成しました。\n\n" +
        filename
      );

    }


    /* ==================================
       復元
       ================================== */

    const restoreDialog =
      document.getElementById(
        "restoreDialog"
      );

    const backupFile =
      document.getElementById(
        "backupFile"
      );

    const restoreInfo =
      document.getElementById(
        "restoreInfo"
      );

    const restoreConfirmButton =
      document.getElementById(
        "restoreConfirmButton"
      );


    document
      .getElementById(
        "restoreButton"
      )
      .addEventListener(
        "click",
        function() {

          closeMenu();

          restoreData =
            null;

          backupFile.value =
            "";

          restoreInfo.textContent =
            "バックアップファイルを選択してください。";

          restoreConfirmButton.disabled =
            true;

          restoreDialog.classList.add(
            "open"
          );

        }
      );


    document
      .getElementById(
        "closeRestoreButton"
      )
      .addEventListener(
        "click",
        function() {

          restoreDialog.classList.remove(
            "open"
          );

        }
      );


    backupFile.addEventListener(
      "change",
      function() {

        const file =
          this.files[0];


        if (
          !file
        ) {

          restoreData =
            null;

          restoreConfirmButton.disabled =
            true;

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function(event) {

            try {

              const data =
                JSON.parse(
                  event.target.result
                );


              if (
                data &&
                Array.isArray(
                  data.favorites
                )
              ) {

                restoreData =
                  data.favorites;

              }

              else if (
                Array.isArray(
                  data
                )
              ) {

                restoreData =
                  data;

              }

              else {

                throw new Error(
                  "データ形式が正しくありません。"
                );

              }


              if (
                restoreData.length === 0
              ) {

                restoreInfo.textContent =
                  "お気に入りが0件のバックアップです。";

              }

              else {

                restoreInfo.innerHTML =
                  "バックアップ内のお気に入り： " +
                  "<strong>" +
                  restoreData.length +
                  "件</strong>";

              }


              restoreConfirmButton.disabled =
                false;

            }

            catch (error) {

              restoreData =
                null;

              restoreConfirmButton.disabled =
                true;

              restoreInfo.textContent =
                "このファイルは使用できません。";

              alert(
                "バックアップファイルを読み込めませんでした。"
              );

              console.error(
                error
              );

            }

          };


        reader.readAsText(
          file
        );

      }
    );


    /* ==================================
       復元実行
       ================================== */

    restoreConfirmButton.addEventListener(
      "click",
      function() {

        if (
          !Array.isArray(
            restoreData
          )
        ) {

          return;

        }


        const result =
          confirm(
            "現在のお気に入りを、\n" +
            restoreData.length +
            "件のバックアップデータに置き換えますか？\n\n" +
            "この操作は現在のデータを上書きします。"
          );


        if (
          !result
        ) {

          return;

        }


        const safetyBackup = {

          version:
            1,

          createdAt:
            new Date().toISOString(),

          favorites:
            favorites

        };


        localStorage.setItem(
          "myFavoritesBeforeRestore",
          JSON.stringify(
            safetyBackup
          )
        );


        favorites =
          restoreData.map(
            (item, index) => {

              const url =
                normalizeUrl(
                  item.url
                );


              return {

                ...item,

                url:
                  url,

                registeredAt:
                  item.registeredAt
                  ||
                  (
                    Date.now() +
                    index
                  ),

                lastClicked:
                  item.lastClicked
                  ||
                  0,

                favicon:
                  item.favicon
                  ||
                  getFaviconUrl(
                    url
                  )

              };

            }
          );


        saveFavorites();


        restoreDialog.classList.remove(
          "open"
        );


        displayFavorites();


        alert(
          "バックアップから復元しました。"
        );

      }
    );


    /* ==================================
       起動
       ================================== */

    applyTheme();

    loadFavorites();

  </script>

</body>
</html>
